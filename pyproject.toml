[project]
name = "syh-python-template"
version = "0.1.0"
description = "Proyecto base de Python con FastAPI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "uvicorn[standard]"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"